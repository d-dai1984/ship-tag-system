 "section": "6.6 二期 · 硬件前提", "no": 4}}, "document": "<h1>船舶资产智能点检标签管理系统<\/h1><p>产品结构与功能范围 · v0.4 · 2026-09-15 · 讨论稿<\/p><h2>0. 本版说明<\/h2><h3>0.1 来源与性质<\/h3><p>本版依据用户提供的 DeepSeek 分享对话（V0.4）重新梳理，原文已存档于 <code>docs/参考-DeepSeek输出-产品结构V0.4-2026-09-15.md<\/code>。<\/p><p>该来源是<strong>外部 AI 生成的讨论稿<\/strong>，不是业务方批准的规格，也不是硬件能力或厂商承诺的证明。本文按其结构和功能范围重新组织产品结构；凡原文中的硬件与平台能力主张，与现有型号资料、厂商资料不一致或尚无依据的，统一收敛到第 10 章标注，正文不按&quot;已确认&quot;书写。<\/p><h3>0.2 与 v0.1 的关系<\/h3><p>v0.1（产品需求大纲）只覆盖&quot;资产与标签台账 + 内容下发 + 状态查看&quot;，把点检、移动端、工单明确列为后续扩展。<\/p><p>v0.4 把<strong>点检闭环重新拉回一期核心<\/strong>，并新增多角色分层看板、环境监测、移动端作业工具，同时规划二期设备调试管理。这是一次范围扩张，不是文字调整。差异与对现有原型的影响见第 9 章。<\/p><h3>0.3 产品命名变化（待确认）<\/h3><div class=\"doc-table\"><table><tbody><tr><td>版本<\/td><td>名称<\/td><\/tr><tr><td>早期技术要求<\/td><td>智能墨水屏设备点检标签系统<\/td><\/tr><tr><td>v0.1<\/td><td>船舶资产电子标签管理系统<\/td><\/tr><tr><td>v0.4（本版来源）<\/td><td>船舶资产智能点检标签管理系统<\/td><\/tr><\/tbody><\/table><\/div><p>名称随范围变化而回到&quot;点检&quot;主线。本文沿用来源名称，<strong>正式名称待业务方确认<\/strong>；确认前 README、结构说明页与原型标题暂不批量改名。<\/p><h3>0.4 本版不含<\/h3><p>页面布局与视觉稿、字段字典、接口定义、数据模型、性能与验收指标、报价与工期。<\/p><hr><h2>1. 产品定位与本版范围<\/h2><p>面向造船行业<strong>设备上船后的存储、保养与点检管理<\/strong>场景。系统以智能墨水屏标签为现场终端，结合工业无线通信与 NFC 近场交互，实现舱室设备的点检状态可视化、保养周期自动化管理和数据闭环追溯。<\/p><p>适用两个阶段：船厂分段建造期间的设备保护管理；交船后船员的日常设备保养。<\/p><p>服务对象按三层角色划分：<\/p><div class=\"doc-table\"><table><tbody><tr><td>角色<\/td><td>视角层级<\/td><td>核心关注<\/td><\/tr><tr><td>船厂中高层<\/td><td>宏观决策层<\/td><td>全船/全厂设备健康度、点检执行率、风险趋势<\/td><\/tr><tr><td>专业主管<\/td><td>管理控制层<\/td><td>分段/班组点检完成率、逾期分布、责任归属<\/td><\/tr><tr><td>专业工人（巡检员/调试员）<\/td><td>执行操作层<\/td><td>个人任务清单、今日待检、逾期设备、现场定位<\/td><\/tr><\/tbody><\/table><\/div><p>一期交付：标签管理后台 + 点检引擎 + 多角色看板 + 环境监测 + 移动端作业工具的完整闭环。<\/p><p>二期交付：设备调试管理程序（不涉及计划编制）。<\/p><hr><h2>2. 系统架构总览<\/h2><h3>2.1 模块构成<\/h3><p>五个核心业务模块 + 两个支撑模块：<\/p><div class=\"doc-table\"><table><tbody><tr><td>模块<\/td><td>定位<\/td><td>核心职责<\/td><td>一期<\/td><\/tr><tr><td>舱室/部位管理<\/td><td>空间与资产组织<\/td><td>按分段、舱室、部位组织设备资产，建立造船特有的空间拓扑档案<\/td><td>✅<\/td><\/tr><tr><td>标签管理<\/td><td>内容维护与下发<\/td><td>维护墨水屏显示内容、LED 控制策略、绑定关系，把信息更新到现场<\/td><td>✅<\/td><\/tr><tr><td>点检引擎<\/td><td>自动化状态判定<\/td><td>按设备保养周期自动推算截止时间，分级预警，驱动标签状态变更<\/td><td>✅<\/td><\/tr><tr><td>看板中心<\/td><td>多角色态势感知<\/td><td>三层角色 × 三级钻取；业务看板 + 系统监控看板两页<\/td><td>✅<\/td><\/tr><tr><td>环境监测<\/td><td>舱室环境感知<\/td><td>温湿度实时采集、超限告警、历史趋势，与保养策略联动<\/td><td>✅<\/td><\/tr><tr><td>移动端<\/td><td>现场作业工具<\/td><td>NFC 唤起、离线作业、防呆表单、报修工单<\/td><td>✅<\/td><\/tr><tr><td>系统管理<\/td><td>运行支撑<\/td><td>船舶信息、网关、账号权限、基础参数、操作日志<\/td><td>✅<\/td><\/tr><tr><td>设备调试管理<\/td><td>交付阶段扩展<\/td><td>调试状态、运行时长、上电/断电动作监控、违章告警<\/td><td>二期<\/td><\/tr><\/tbody><\/table><\/div><p>v0.1 的&quot;标签状态&quot;不再是独立一级模块，其内容拆分进<strong>看板中心第二页（系统监控看板）<\/strong>与标签台账的状态列（见第 9 章）。<\/p><h3>2.2 部署与链路<\/h3><pre>墨水屏标签（BLE/可选 NFC）\n   ↕\n现场多网关（本地缓存，弱网续传）\n   ↕\n船厂内网边缘服务（Docker 私有化部署）\n   ↕                        ↕\nWeb 管理端 / 看板中心      移动端（离线作业）\n   ↕\nMES / EAM（RESTful API / MQTT）\n<\/pre><p>架构中的 Docker 私有化、30 天网关缓存、REST/MQTT 北向接口目前均为<strong>方向性描述，无厂商书面承诺<\/strong>，详见第 10 章。<\/p><h3>2.3 硬件终端规格<\/h3><p>下表左列为 V0.4 原文主张，右列为本项目按现有型号资料（STag29AQ 规格书）给出的当前依据状态。<strong>正文功能设计以右列为准。<\/strong><\/p><div class=\"doc-table\"><table><tbody><tr><td>项目<\/td><td>V0.4 原文主张<\/td><td>当前依据状态<\/td><\/tr><tr><td>显示屏<\/td><td>三色电子纸（黑/白/红）<\/td><td>⚠️ 候选机为<strong>黑/白/红/黄四色<\/strong>、296×128 px、2.9 寸。原文同时要求&quot;黄色临期模板&quot;，与&quot;三色&quot;自相矛盾；按<strong>四色<\/strong>设计<\/td><\/tr><tr><td>指示灯<\/td><td>超高亮 RGB 多色 LED，常亮/急闪/慢闪<\/td><td>⚠️ 规格书只写&quot;多色 LED&quot;；可用色值、亮度、可视距离、闪烁模式未确认<\/td><\/tr><tr><td>NFC<\/td><td>内置 Type 2，&lt;2cm，NDEF Token 防伪<\/td><td>❌ 规格书标为<strong>可选项<\/strong>，未给芯片型号、NDEF 能力、防克隆方案<\/td><\/tr><tr><td>通信<\/td><td>Sub-1G / BLE 工业无线<\/td><td>⚠️ 候选机仅 <strong>BLE 5.0<\/strong>，无 Sub-1G。要 Sub-1G 需换型号<\/td><\/tr><tr><td>遥测<\/td><td>上报电压、RSSI、LQI、刷新回执<\/td><td>⚠️ 电量/状态广播有描述；RSSI/LQI、刷新回执、可靠送达未证明<\/td><\/tr><tr><td>按键<\/td><td>1~2 颗工业级微动按键<\/td><td>⚠️ 实物为 <strong>1 颗<\/strong>；按键后广播 30 秒，期间不响应其他指令<\/td><\/tr><tr><td>电池<\/td><td>单组电池续航 5 年以上<\/td><td>⚠️ 为 25°C、每天刷图 5 次的<strong>理论测算<\/strong>；本版新增的 LED 告警闪烁、临期黄闪、心跳与环境采集均会额外耗电，需重新测算<\/td><\/tr><tr><td>环境传感<\/td><td>可选集成温湿度传感器<\/td><td>❌ 规格书未提及标签内置温湿度。集成式方案未证明，外挂式/网关式更现实<\/td><\/tr><tr><td>显示内容<\/td><td>分段号、设备编码、设备名称、责任班组、倒计时、防伪二维码<\/td><td>✅ 版式能力方向可行，实际可读性需按 296×128 实机验证<\/td><\/tr><\/tbody><\/table><\/div><p>标注含义：✅ 有直接依据 ／ ⚠️ 方向一致但缺验收参数 ／ ❌ 当前资料无法证明。<\/p><hr><h2>3. 产品结构大纲<\/h2><pre>船舶资产智能点检标签管理系统\n├── 看板中心\n│   ├── 第一页 业务看板\n│   │   ├── 视图一 中高层 · 宏观决策看板\n│   │   ├── 视图二 专业主管 · 管理控制看板\n│   │   └── 视图三 专业工人 · 执行操作看板\n│   └── 第二页 系统监控看板（IT 运维）\n│       ├── 标签运行监控\n│       ├── 网关运行监控\n│       ├── 系统健康度\n│       └── 告警中心\n├── 舱室/部位管理\n│   ├── 四级目录管理（Hull No. → 分段 Block → 舱室 Compartment → 部位 Position）\n│   ├── 目录概览\n│   ├── 下属资产与标签数据\n│   ├── 归属调整\n│   └── 设备电子台账（含保养规程与检查项标准）\n├── 标签管理\n│   ├── 标签台账与使用状态\n│   ├── 扫码绑定 / 解绑 / 更换\n│   ├── 标签分组（跨舱室）\n│   ├── 字段配置与信息录入 / 批量导入导出\n│   ├── 模板设计与模板管理\n│   ├── 信息下发与更新任务\n│   ├── 刷新计划（即时/定时/周期）\n│   └── LED 控制策略\n├── 点检引擎\n│   ├── 保养周期与截止时间推算\n│   ├── 分级预警规则（临期/逾期/完成）\n│   ├── 标签屏幕与 LED 联动\n│   ├── 点检流水与审计追溯\n│   └── 电源自检与低电告警\n├── 环境监测\n│   ├── 温湿度采集（集成式/外挂式/网关集成）\n│   ├── 超限告警\n│   ├── 历史趋势与环境报表\n│   └── 与保养策略联动（高湿缩短周期）\n├── 移动端（点检员作业工具）\n│   ├── NFC 碰一碰唤起点检表单\n│   ├── 离线作业与自动补传\n│   ├── 标准化防呆电子表单\n│   ├── 即时物理闭环反馈（变屏 + 绿灯 3 秒）\n│   └── 一键报修与派工推送\n├── 系统管理（支撑）\n│   ├── 船舶信息\n│   ├── 网关管理\n│   ├── 账号、角色与数据权限\n│   ├── 基础参数\n│   └── 操作日志\n└── 【二期】设备调试管理\n    ├── 调试任务管理（接收/分配/执行，不含计划编制）\n    ├── 调试状态监控\n    ├── 设备运行时长监控\n    ├── 上电/断电动作监控\n    ├── 违章作业告警\n    ├── 调试记录与报告\n    ├── 调试问题追踪\n    └── 调试看板（三层角色，与点检看板并列）\n<\/pre><hr><h2>4. 核心管理对象<\/h2><div class=\"doc-table\"><table><tbody><tr><td>对象<\/td><td>定义与关系<\/td><td>变化<\/td><\/tr><tr><td>船舶（Hull No.）<\/td><td>管理范围的根；<strong>即目录一级<\/strong>，单船部署下为固定根节点，多船扩展时该层承载多条船<\/td><td><strong>调整<\/strong>：v0.1 为&quot;根对象不占层级&quot;，本版纳入一级<\/td><\/tr><tr><td>空间目录<\/td><td><strong>四级<\/strong>：Hull No. → 分段/Block → 舱室/Compartment → 部位/Position；设备资产与标签不占层级<\/td><td><strong>已决策<\/strong>：v0.1 的三级是草稿，本版按实际需求改为四级，并绑定造船分段编码体系<\/td><\/tr><tr><td>设备资产<\/td><td>业务信息载体；新增<strong>保养规程、检查项标准、保养周期<\/strong><\/td><td><strong>扩展<\/strong>：从&quot;身份+责任信息&quot;扩展为可驱动点检引擎的档案<\/td><\/tr><tr><td>电子标签<\/td><td>现场显示硬件，通过绑定关系展示资产信息与点检状态<\/td><td>同 v0.1<\/td><\/tr><tr><td>标签分组<\/td><td>面向批量操作的集合，可跨舱室<\/td><td>同 v0.1<\/td><\/tr><tr><td>字段与模板<\/td><td>字段定义数据，模板定义呈现方式<\/td><td>同 v0.1<\/td><\/tr><tr><td>下发任务<\/td><td>记录实际执行进度与结果<\/td><td>同 v0.1<\/td><\/tr><tr><td><strong>点检任务/流水<\/strong><\/td><td>由点检引擎按周期自动生成；记录执行人、时间、表单、照片<\/td><td><strong>新增<\/strong><\/td><\/tr><tr><td><strong>环境监测点<\/strong><\/td><td>舱室级温湿度采集对象，可独立于设备资产存在<\/td><td><strong>新增<\/strong><\/td><\/tr><tr><td><strong>告警<\/strong><\/td><td>统一告警对象：点检逾期、标签异常、网关异常、环境超限、（二期）违章作业<\/td><td><strong>新增<\/strong><\/td><\/tr><tr><td><strong>角色视图<\/strong><\/td><td>中高层/专业主管/专业工人，决定看板默认视图与数据范围<\/td><td><strong>新增<\/strong>，与账号权限强相关<\/td><\/tr><tr><td>【二期】调试任务<\/td><td>外部导入或管理员指派，不做计划编制与审批<\/td><td>二期新增<\/td><\/tr><tr><td>【二期】设备操作记录<\/td><td>上电/断电动作、操作人、时间、运行时长<\/td><td>二期新增<\/td><\/tr><\/tbody><\/table><\/div><p>空间编码依据：分段编码遵循造船行业通用规则，由区域代码（A-尾部、E-机舱、H-中部、F-首部、L-上层建筑）、位置代码和顺序代码组成；舱室编码参照 CB/T 3164。<strong>这两条编码规则来自 V0.4 原文，需由船厂业务方确认是否与其现行编码一致。<\/strong><\/p><h3>4.1 目录层级口径（已决策，2026-09-15）<\/h3><p><strong>采用四级目录<\/strong>：<code>Hull No.（船号）→ 分段 Block → 舱室 Compartment → 部位 Position<\/code>。设备资产与电子标签均不占目录层级。<\/p><p>v0.1 的&quot;最多三级&quot;是初版草稿，未绑定造船实际空间体系；本版按实际需求改为四级。<\/p><div class=\"doc-table\"><table><tbody><tr><td>层级<\/td><td>含义<\/td><td>编码依据<\/td><td>是否必建<\/td><\/tr><tr><td>一级 · Hull No.<\/td><td>船号，即船舶本身<\/td><td>船厂船号体系<\/td><td>必建。单船部署下为固定根节点，界面上不额外占一次点击<\/td><\/tr><tr><td>二级 · 分段 Block<\/td><td>施工分段<\/td><td>区域代码（A-尾部、E-机舱、H-中部、F-首部、L-上层建筑）+ 位置代码 + 顺序代码<\/td><td>必建<\/td><\/tr><tr><td>三级 · 舱室 Compartment<\/td><td>舱室/房间<\/td><td>参照 CB/T 3164 坐标式编码<\/td><td>必建<\/td><\/tr><tr><td>四级 · 部位 Position<\/td><td>舱室内的功能部位/系统分区<\/td><td>按功能系统命名（燃油供给、滑油系统、压载系统等）<\/td><td><strong>可选<\/strong>，允许跳级<\/td><\/tr><\/tbody><\/table><\/div><p>配套规则：<\/p><ol><li><strong>允许跳级<\/strong>：不是每个舱室都需要细分部位。设备资产可直接挂在三级舱室下，也可挂在四级部位下。目录树与列表必须同时支持这两种挂载深度。<\/li><li><strong>Hull No. 层的双重作用<\/strong>：单船部署时它是固定根节点，避免多一层无意义点击；多船扩展时该层天然承载多条船，<strong>无需改动层级定义或做数据迁移<\/strong>。这是选四级而非三级的主要理由。<\/li><li><strong>&quot;部位&quot;不等于&quot;系统&quot;<\/strong>：压载系统、消防系统这类会贯穿多个分段的跨舱室系统，不靠目录表达，用<strong>标签分组<\/strong>表达（目录管主归属，分组管跨目录批量操作）。<\/li><li><strong>各级名称可配置<\/strong>：层级语义固定，但显示名称可按船厂实际叫法调整（如&quot;分段&quot;叫&quot;总段&quot;或&quot;Block&quot;）。<\/li><\/ol><p>层级示例：<\/p><pre>Hull No. H2601                       ← 一级 · 船号（单船部署下为固定根节点）\n├── 分段 E101（机舱分段）             ← 二级 · 分段 Block\n│   ├── 主机舱                        ← 三级 · 舱室 Compartment\n│   │   ├── 燃油供给部位              ← 四级 · 部位 Position\n│   │   │   └── 燃油输送泵            ← 设备资产（不占层级）→ 绑定标签\n│   │   └── 滑油系统部位\n│   │       └── 滑油泵、滤器\n│   └── 辅机舱\n│       └── 发电机组部位\n│           └── 主发电机\n├── 分段 H201（货舱双层底）\n│   └── 双层底舱室\n│       └── 压载系统部位\n│           └── 压载泵\n├── 分段 L301（上层建筑）\n│   └── 驾驶室\n│       └── 导航设备部位\n│           └── 雷达、GPS\n└── 分段 F401（首部）\n    └── 锚链舱\n        └── 锚机                      ← 允许跳级：设备直接挂三级，不建部位层\n<\/pre><p>待确认：大型船舶是否需要在分段之上再加&quot;总段/Grand Block&quot;层。若需要，会变成五级，<strong>目录深度上限须在开发前定死<\/strong>，不宜留成运行时可扩展。<\/p><hr><h2>5. 模块功能范围<\/h2><h3>5.1 舱室/部位管理<\/h3><div class=\"doc-table\"><table><tbody><tr><td>功能<\/td><td>需求<\/td><\/tr><tr><td>四级目录管理<\/td><td>目录新增、编辑、排序、移动与删除；四级为 Hull No. → 分段 → 舱室 → 部位，部位层可跳过；各级显示名称可配置<\/td><\/tr><tr><td>目录概览<\/td><td>查看当前目录及下级目录的资产数量、标签数量、绑定情况和异常概况<\/td><\/tr><tr><td>下属数据管理<\/td><td>查看与维护当前目录下的资产信息，支持搜索、筛选与自定义显示列<\/td><\/tr><tr><td>归属调整<\/td><td>资产及其关联标签的单个、批量迁移；调整归属时保持关联<\/td><\/tr><tr><td>结构维护保护<\/td><td>调整或删除目录时处理下属目录与数据，避免资产、标签失去归属<\/td><\/tr><tr><td>电子台账录入<\/td><td>设备编码、名称、型号、位置、责任工区/班组、责任人<\/td><\/tr><tr><td><strong>保养规程与检查项标准<\/strong><\/td><td>维护设备保养周期、保养规程、点检检查项清单，作为点检引擎与移动端表单的输入<\/td><\/tr><\/tbody><\/table><\/div><h3>5.2 标签管理<\/h3><div class=\"doc-table\"><table><tbody><tr><td>功能<\/td><td>需求<\/td><\/tr><tr><td>标签台账<\/td><td>唯一标识/MAC、型号、屏幕尺寸、支持颜色、所属目录、使用状态；单个与批量登记查询<\/td><\/tr><tr><td><strong>一键扫码绑定<\/strong><\/td><td>手机扫设备二维码 + 扫标签 MAC，后台自动关联并<strong>触发首次下发刷屏<\/strong><\/td><\/tr><tr><td>资产绑定<\/td><td>绑定、解绑、更换；查看关联资产及绑定记录；待绑定/在用/停用状态<\/td><\/tr><tr><td>标签分组<\/td><td>新增、编辑、删除分组，维护成员；按设备类型、责任班组或维护用途组织，支持跨舱室<\/td><\/tr><tr><td>字段配置<\/td><td>配置资产与标签显示所需字段（名称、类型、必填等）<\/td><\/tr><tr><td>信息录入<\/td><td>逐条录入、编辑及批量修改<\/td><\/tr><tr><td>批量导入<\/td><td>导入模板、数据导入、字段匹配、数据校验、结果反馈；支持新增与更新既有记录<\/td><\/tr><tr><td>数据导出<\/td><td>按目录、分组或筛选结果导出<\/td><\/tr><tr><td>模板设计<\/td><td>按尺寸、分辨率和颜色设计版式；支持文本、图片、二维码和图形元素，与业务字段关联<\/td><\/tr><tr><td>模板管理<\/td><td>新增、编辑、复制、预览、版本管理及应用范围查看<\/td><\/tr><tr><td><strong>点检状态模板组<\/strong><\/td><td>至少三套并存并可自动切换：正常模板、临期黄色提醒模板、逾期红底白字警示模板<\/td><\/tr><tr><td>信息下发<\/td><td>单个、批量、按目录或分组下发；支持首次发布及数据、模板变更后的更新<\/td><\/tr><tr><td>更新任务<\/td><td>任务进度、标签执行结果、失败原因；失败重试与历史记录查询<\/td><\/tr><tr><td>刷新计划<\/td><td>即时、定时和周期刷新<\/td><\/tr><tr><td>LED 控制策略<\/td><td>配置各业务状态对应的 LED 颜色与闪烁方式；支持单个、批量点灯用于现场寻标<\/td><\/tr><\/tbody><\/table><\/div><p>墨水屏动态显示内容：分段号、设备编码、设备名称、责任班组、点检周期倒计时、防伪打卡二维码。<\/p><p>逾期视觉突变：逾期后屏幕顶部反色显示&quot;⚠ 逾期未检！已超期 XX 小时&quot;红底白字警示条。<\/p><p><strong>&quot;已超期 XX 小时&quot;随时间变化意味着需要周期性重刷<\/strong>，与&quot;5 年续航&quot;的刷新频率假设直接冲突，刷新粒度（每小时？每 4 小时？）必须先定，见第 10 章。<\/p><h3>5.3 点检引擎<\/h3><p>后台守护进程每 5 分钟轮询，按每台设备的保养周期（如 7 天、30 天，参照船舶 PMS 计划保养体系设定）自动推算下次截止时间。<\/p><p>分级自动预警规则：<\/p><div class=\"doc-table\"><table><tbody><tr><td>触发条件<\/td><td>屏幕显示<\/td><td>LED 指示灯<\/td><td>后台动作<\/td><\/tr><tr><td>距截止 &lt; 24 小时<\/td><td>下发&quot;临期待检&quot;黄色提醒模板<\/td><td>黄色慢闪<\/td><td>记录预警流水<\/td><\/tr><tr><td>超过截止时间<\/td><td>推送红底白字逾期模板，顶部反色显示逾期警示<\/td><td>红色高频间歇闪烁<\/td><td>生成报警流水，同步后台告警<\/td><\/tr><tr><td>点检完成<\/td><td>恢复正常模板，截止日期自动后移<\/td><td>绿灯常亮 3 秒<\/td><td>记录点检流水<\/td><\/tr><\/tbody><\/table><\/div><div class=\"doc-table\"><table><tbody><tr><td>功能<\/td><td>需求<\/td><\/tr><tr><td>周期与截止推算<\/td><td>按设备保养周期推算下次截止时间，支持周期调整后重算<\/td><\/tr><tr><td>分级预警<\/td><td>临期、逾期两级阈值可配置；阈值变更影响存量任务的处理规则需定义<\/td><\/tr><tr><td>屏幕与 LED 联动<\/td><td>状态变化自动触发模板下发与 LED 指令；下发失败时的状态一致性策略需定义<\/td><\/tr><tr><td>点检流水<\/td><td>记录每次点检的执行人、时间、表单内容、照片，支持审计追溯<\/td><\/tr><tr><td>物理按键交互<\/td><td>巡检员现场手动触发&quot;点亮当前状态 LED&quot;或强制发起一次射频心跳<\/td><\/tr><tr><td>电源自检<\/td><td>上报电池电压、RSSI/LQI、屏幕刷新回执、按键事件<\/td><\/tr><tr><td>低电告警<\/td><td>电量低于阈值时屏幕显示低电量图标，同步上报后台告警<\/td><\/tr><\/tbody><\/table><\/div><p><strong>状态一致性原则（沿用 v0.1，仍然成立）<\/strong>：标签在线 ≠ 屏幕已更新。任务发送成功不等于刷屏成功。&quot;点检完成&quot;必须区分三个状态——手机本地已保存、边缘服务器已接收、标签已刷新/点灯，且离线时必须定义超时与最终一致性口径。<\/p><h3>5.4 看板中心<\/h3><h4>5.4.1 设计原则<\/h4><p>采用&quot;<strong>三层角色 × 三级钻取<\/strong>&quot;架构，从宏观到执行逐层深入。<\/p><p>钻取路径：中高层宏观视图 →（点击分段/指标）→ 专业主管管理视图 →（点击班组/设备）→ 专业工人执行视图 → 定位到具体设备标签。<\/p><p>三层视图是同一份数据的不同聚合口径，不是三套独立数据源。角色决定默认落地视图与数据范围，但上级视图应可向下钻取到明细。<\/p><h4>5.4.2 第一页：业务看板<\/h4><p><strong>视图一 · 船厂中高层（宏观决策）<\/strong><\/p><p>核心指标卡片：<\/p><div class=\"doc-table\"><table><tbody><tr><td>指标<\/td><td>说明<\/td><td>可视化<\/td><\/tr><tr><td>全船设备完好率<\/td><td>正常设备数 / 总设备数<\/td><td>环形图 + 百分比<\/td><\/tr><tr><td>点检完成率<\/td><td>本期已完成点检数 / 应完成数<\/td><td>仪表盘 + 趋势线<\/td><\/tr><tr><td>逾期报警总数<\/td><td>当前逾期未检设备数<\/td><td>数字 + 红黄绿分级<\/td><\/tr><tr><td>标签在线率<\/td><td>在线标签数 / 标签总数<\/td><td>进度条<\/td><\/tr><tr><td>环境异常数<\/td><td>温湿度超限舱室数<\/td><td>数字 + 告警标识<\/td><\/tr><\/tbody><\/table><\/div><p>趋势与对比：近 7 天/30 天点检完成率趋势曲线；各分段设备完好率对比柱状图；逾期报警趋势（按日/周）。<\/p><p>风险聚焦：TOP 5 逾期最严重的分段；TOP 5 逾期最严重的责任班组；重大设备故障报修中清单。<\/p><p>钻取入口：点击任一分段 → 该分段的主管管理视图；点击任一指标 → 下钻对应明细。<\/p><p><strong>视图二 · 专业主管（管理控制）<\/strong><\/p><div class=\"doc-table\"><table><tbody><tr><td>功能<\/td><td>说明<\/td><\/tr><tr><td>分段点检完成率排名<\/td><td>各分段完成率排序，支持升降序<\/td><\/tr><tr><td>班组点检完成率排名<\/td><td>各责任班组完成率排序<\/td><\/tr><tr><td>逾期设备清单<\/td><td>按逾期时长排序；设备名称、编码、责任班组、逾期小时数<\/td><\/tr><tr><td>临期待检清单<\/td><td>距截止 &lt; 24 小时的设备清单<\/td><\/tr><tr><td>设备故障报修清单<\/td><td>当前&quot;故障报修中&quot;的设备及派工状态<\/td><\/tr><tr><td>设备类型维度统计<\/td><td>各类型设备（泵、阀、发电机、雷达等）的点检完成率与故障率<\/td><\/tr><tr><td>环境监测概览<\/td><td>各舱室温湿度实时值；超限舱室清单及告警等级<\/td><\/tr><\/tbody><\/table><\/div><p>钻取入口：点击任一设备 → 该设备的执行视图；点击任一班组 → 筛选该班组全部设备。<\/p><p><strong>视图三 · 专业工人（执行操作）<\/strong><\/p><div class=\"doc-table\"><table><tbody><tr><td>功能<\/td><td>说明<\/td><\/tr><tr><td>今日待检<\/td><td>今日需完成的点检任务列表，按截止时间排序<\/td><\/tr><tr><td>逾期任务<\/td><td>已逾期未检任务，红色高亮，显示逾期时长<\/td><\/tr><tr><td>临期任务<\/td><td>距截止 &lt; 24 小时任务，黄色提醒<\/td><\/tr><tr><td>已完成<\/td><td>今日已完成任务及完成时间<\/td><\/tr><tr><td>设备导航与定位<\/td><td>显示所在分段、舱室、部位；结合分段平面图或文字指引导航；显示当前标签状态<\/td><\/tr><tr><td>快速操作<\/td><td>NFC 碰一碰唤起点检表单；一键报修；拍照存证<\/td><\/tr><\/tbody><\/table><\/div><p>执行视图与移动端功能高度重叠，需明确：<strong>它是 Web 端的只读任务视图，还是移动端界面在 Web 的镜像<\/strong>。见第 11 章。<\/p><h4>5.4.3 第二页：系统监控看板（IT 运维）<\/h4><p>面向系统管理员与 IT 运维人员。<\/p><p>标签运行监控：<\/p><div class=\"doc-table\"><table><tbody><tr><td>监控项<\/td><td>说明<\/td><td>告警阈值<\/td><\/tr><tr><td>标签在线率<\/td><td>在线标签数 / 标签总数<\/td><td>&lt;95% 黄色，&lt;90% 红色<\/td><\/tr><tr><td>离线标签清单<\/td><td>超过 N 小时未心跳的标签<\/td><td>可配置（默认 24 小时）<\/td><\/tr><tr><td>低电量标签<\/td><td>电量低于阈值的标签<\/td><td>可配置（默认 20%）<\/td><\/tr><tr><td>弱信号标签<\/td><td>RSSI 低于阈值的标签<\/td><td>可配置<\/td><\/tr><tr><td>刷新失败标签<\/td><td>最近一次下发失败或超时的标签<\/td><td>任何失败即告警<\/td><\/tr><tr><td>最后心跳时间分布<\/td><td>标签心跳时间分布图<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><p>网关运行监控：网关在线状态、连接标签数、数据吞吐量、缓存积压量、最后通信时间。<\/p><p>系统健康度：CPU/内存/存储使用率、数据库状态（连接数、慢查询、存储空间）、上报成功率、下发成功率、API/MQTT 连接状态与消息积压。<\/p><p>告警中心：实时告警列表（标签离线、低电量、网关离线、系统资源超限等）；告警分级（紧急/重要/次要/提示）；告警处理状态（未处理/处理中/已解决）；告警历史查询与统计。<\/p><p><strong>告警中心应是全系统统一入口<\/strong>，覆盖业务告警（点检逾期、环境超限、二期违章）与系统告警（标签/网关/服务器），而不只是 IT 运维告警。分级与处理流程需统一设计。<\/p><p>补充：v0.1&quot;标签状态&quot;模块中的<strong>单标签详情页<\/strong>（基础信息、最近上报数据、关联资产与网关、当前模板、下发历史）在本版没有明确归属，建议保留，挂在标签台账下作为详情页，从系统监控看板与业务看板均可跳入。<\/p><h3>5.5 环境监测<\/h3><p>采集方案：<\/p><div class=\"doc-table\"><table><tbody><tr><td>方案<\/td><td>说明<\/td><td>适用场景<\/td><td>依据状态<\/td><\/tr><tr><td>集成式<\/td><td>温湿度传感器集成在墨水屏标签内部<\/td><td>标签安装位置即需监测的舱室<\/td><td>❌ 候选机规格未提供，需换型或定制<\/td><\/tr><tr><td>外挂式<\/td><td>独立温湿度标签，与设备标签共用网关<\/td><td>需独立监测环境的场景<\/td><td>⚠️ 需确认型号与网关兼容性<\/td><\/tr><tr><td>网关集成<\/td><td>温湿度传感器集成在网关内部<\/td><td>网关所在舱室的本地环境监测<\/td><td>⚠️ 需确认网关型号能力<\/td><\/tr><\/tbody><\/table><\/div><div class=\"doc-table\"><table><tbody><tr><td>功能<\/td><td>需求<\/td><\/tr><tr><td>实时采集<\/td><td>按设定周期（如每 30 分钟）采集舱室温湿度<\/td><\/tr><tr><td>超限告警<\/td><td>超过阈值生成告警流水，可选推送至标签 LED<\/td><\/tr><tr><td>历史趋势<\/td><td>按舱室/分段展示温湿度历史曲线<\/td><\/tr><tr><td>环境报表<\/td><td>按日/周/月生成温湿度统计报表<\/td><\/tr><tr><td><strong>与保养策略联动<\/strong><\/td><td>高湿环境自动缩短保养周期（如 30 天 → 14 天），自动更新点检引擎截止时间<\/td><\/tr><tr><td>环境监测看板<\/td><td>实时值一览、超限清单与告警等级、历史趋势图、环境异常与设备故障关联分析<\/td><\/tr><\/tbody><\/table><\/div><p><strong>两处需要决策<\/strong>：<\/p><ol><li>保养周期自动调整会改变已下发到标签的倒计时，可能造成&quot;设备昨天还正常今天就临期&quot;。是否需要人工确认环节、调整历史是否可追溯，必须先定。<\/li><li>候选标签工作环境仅 <strong>0–40°C、45%–70% RH<\/strong>。需要监测高湿告警的舱室，标签本身未必能在该湿度下正常工作——<strong>监测对象的环境范围超出了监测终端的工作范围<\/strong>。这是选型级冲突，见第 10 章。<\/li><\/ol><h3>5.6 移动端（点检员作业工具）<\/h3><p>针对无公网、工人戴手套、环境油污等一线痛点。<\/p><div class=\"doc-table\"><table><tbody><tr><td>功能<\/td><td>需求<\/td><td>依赖<\/td><\/tr><tr><td>NFC 碰一碰唤起<\/td><td>无需预先打开 App，手机背部轻碰标签，自动弹窗直达该设备点检表单<\/td><td>❌ 强依赖标签 NFC，当前为可选项<\/td><\/tr><tr><td>防假检机制<\/td><td>从物理层杜绝远程代打卡<\/td><td>❌ 需 NDEF Token 防克隆方案，未证明<\/td><\/tr><tr><td>离线作业<\/td><td>碰一碰后从本地缓存调出表单，离线填报并拍照存证<\/td><td>⚠️ 需定义缓存范围、容量、有效期<\/td><\/tr><tr><td>自动补传<\/td><td>走出到有 Wi-Fi/5G 区域后自动补传打卡流水<\/td><td>⚠️ 需定义幂等键、冲突规则、补传状态<\/td><\/tr><tr><td>标准化防呆表单<\/td><td>按设备类型自动加载作业清单；异常项强制拍照并填写描述；支持预设故障标签快选<\/td><td>✅<\/td><\/tr><tr><td>即时物理闭环反馈<\/td><td>提交成功瞬间调度现场标签：变回正常模板、截止日期后移、绿灯常亮 3 秒<\/td><td>⚠️ 弱网/离线下无法保证&quot;即时&quot;，须定义超时与最终一致性<\/td><\/tr><tr><td>一键故障报修<\/td><td>勾选转报修工单，标记设备&quot;故障报修中&quot;，向维保班组长推送派工消息与现场照片<\/td><td>⚠️ 需定义工单状态机与通知通道<\/td><\/tr><\/tbody><\/table><\/div><p><strong>离线移动端与离线网关是两个独立缓存域<\/strong>，必须分别设计记录 ID、版本、幂等键、冲突规则与补传状态，不能混为一谈。<\/p><h3>5.7 管理后台与边缘系统<\/h3><div class=\"doc-table\"><table><tbody><tr><td>能力<\/td><td>描述<\/td><td>依据状态<\/td><\/tr><tr><td>本地边缘私有化部署<\/td><td>基于 Docker 的内网脱机部署，适配金属屏蔽重、分段设备繁杂的环境<\/td><td>❌ 厂商仅宣传&quot;支持内网私有部署&quot;，未承诺 Docker、离线依赖、授权、升级回滚、备份恢复<\/td><\/tr><tr><td>弱网容灾与断网续传<\/td><td>网关本地缓存 30 天，网络恢复后背压平滑补传<\/td><td>❌ 厂商只写&quot;USB 断网存储&quot;，未给容量、数据模型、30 天保证或补传策略<\/td><\/tr><tr><td>北向对接 MES/EAM<\/td><td>RESTful API / MQTT 推送点检数据、缺陷与工单<\/td><td>❌ 未确认 REST 规格、MQTT 主题、认证、幂等、版本、限流、双向同步<\/td><\/tr><tr><td>多基站去重与分段定位<\/td><td>多网关数据去重，按信号差粗估标签所在分段<\/td><td>❌ 无产品承诺，去重算法与定位准确率未知<\/td><\/tr><\/tbody><\/table><\/div><h3>5.8 系统管理<\/h3><div class=\"doc-table\"><table><tbody><tr><td>功能<\/td><td>需求<\/td><\/tr><tr><td>船舶信息<\/td><td>维护船名、Hull No. 等当前船舶基础信息<\/td><\/tr><tr><td>网关管理<\/td><td>维护网关身份、安装位置、连接状态及关联标签<\/td><\/tr><tr><td>账号与权限<\/td><td>管理账号、角色、功能权限和目录数据范围<\/td><\/tr><tr><td><strong>角色视图配置<\/strong><\/td><td>将账号映射到中高层/专业主管/专业工人三层视角，决定看板默认落地页与数据范围<\/td><\/tr><tr><td>基础参数<\/td><td>状态判定、异常提醒、默认刷新、告警阈值等参数<\/td><\/tr><tr><td>操作日志<\/td><td>目录调整、数据导入修改、绑定变更、模板策略修改及下发操作<\/td><\/tr><\/tbody><\/table><\/div><p>系统管理是支撑功能，当前按单船管理考虑，多船管理作为后续扩展。<\/p><hr><h2>6. 二期规划：设备调试管理<\/h2><h3>6.1 定位<\/h3><p>设备上船安装后、交船前需进行调试（Commissioning）管理。二期在现有标签系统基础上扩展调试管理能力，把覆盖范围从&quot;保养点检&quot;延伸到&quot;调试交付&quot;。<\/p><p><strong>明确不做<\/strong>：调试计划编制、计划审批、计划发布。任务来源为外部系统导入或管理员直接指派。<\/p><p>聚焦四件事：调试状态监控、设备运行时长监控、上电/断电动作监控、违章作业告警。<\/p><h3>6.2 功能模块<\/h3><div class=\"doc-table\"><table><tbody><tr><td>模块<\/td><td>功能<\/td><td>说明<\/td><\/tr><tr><td>调试任务管理<\/td><td>任务接收、分配、执行<\/td><td>从外部系统或管理员接收任务，分配到调试班组/个人，支持状态跟踪；<strong>不含计划编制<\/strong><\/td><\/tr><tr><td>调试状态监控<\/td><td>全船设备调试状态实时展示<\/td><td>按分段/系统/设备类型展示：待调试、调试中、待验收、已验收<\/td><\/tr><tr><td>设备运行时长监控<\/td><td>统计设备累计运行时长<\/td><td>通过外接电流传感器或与设备控制系统集成记录上电运行时长<\/td><\/tr><tr><td>上电/断电动作监控<\/td><td>记录并验证操作合规性<\/td><td>调试员操作时 NFC 碰一碰标签确认，记录操作人、时间、动作类型，结合设备状态反馈验证合规<\/td><\/tr><tr><td>违章作业告警<\/td><td>识别并告警违规操作<\/td><td>规则引擎判断违章行为，实时推送告警并触发标签 LED 红色闪烁<\/td><\/tr><tr><td>调试记录管理<\/td><td>调试数据录入、报告生成<\/td><td>记录调试参数、结果、问题，自动生成调试报告<\/td><\/tr><tr><td>调试问题追踪<\/td><td>问题登记、整改、闭环<\/td><td>调试中发现的问题登记、派工整改、复验闭环<\/td><\/tr><tr><td>与点检系统联动<\/td><td>调试完成后自动转入保养点检<\/td><td>调试通过后设备自动纳入 PMS 保养计划<\/td><\/tr><\/tbody><\/table><\/div><h3>6.3 调试看板（三层角色，与点检看板并列）<\/h3><p><strong>视图一 · 中高层（宏观）<\/strong><\/p><div class=\"doc-table\"><table><tbody><tr><td>指标<\/td><td>说明<\/td><\/tr><tr><td>全船调试完成率<\/td><td>已验收设备数 / 应调试设备总数<\/td><\/tr><tr><td>调试状态分布<\/td><td>待调试、调试中、待验收、已验收占比<\/td><\/tr><tr><td>重大违规告警统计<\/td><td>本期违章作业告警总数及趋势<\/td><\/tr><tr><td>设备运行时长汇总<\/td><td>全船设备累计运行时长统计<\/td><\/tr><tr><td>风险聚焦<\/td><td>TOP 5 调试滞后分段、TOP 5 违规操作班组<\/td><\/tr><\/tbody><\/table><\/div><p><strong>视图二 · 专业主管（管理）<\/strong><\/p><div class=\"doc-table\"><table><tbody><tr><td>功能<\/td><td>说明<\/td><\/tr><tr><td>各调试班组任务进度<\/td><td>各班组调试任务完成率排名<\/td><\/tr><tr><td>设备调试状态清单<\/td><td>按设备类型/分段筛选，显示调试状态、责任人、计划时间<\/td><\/tr><tr><td>违规告警清单<\/td><td>违章记录：操作人、时间、违规类型、处理状态<\/td><\/tr><tr><td>上电/断电记录异常清单<\/td><td>未经确认的上电/断电操作、操作时间异常等<\/td><\/tr><tr><td>设备运行时长明细<\/td><td>各设备累计运行时长，支持排序与筛选<\/td><\/tr><\/tbody><\/table><\/div><p><strong>视图三 · 专业工人/调试员（执行）<\/strong><\/p><div class=\"doc-table\"><table><tbody><tr><td>功能<\/td><td>说明<\/td><\/tr><tr><td>个人调试任务<\/td><td>待执行、执行中、已完成任务列表<\/td><\/tr><tr><td>上电/断电操作确认<\/td><td>执行操作前 NFC 碰一碰标签，确认操作类型与设备<\/td><\/tr><tr><td>违规提醒<\/td><td>实时接收违章告警，查看违规详情与整改要求<\/td><\/tr><tr><td>设备状态反馈<\/td><td>查看当前调试状态、运行时长、最近操作记录<\/td><\/tr><tr><td>问题上报<\/td><td>一键提交问题记录与照片<\/td><\/tr><\/tbody><\/table><\/div><h3>6.4 违章作业告警规则示例<\/h3><div class=\"doc-table\"><table><tbody><tr><td>违规类型<\/td><td>规则说明<\/td><td>告警方式<\/td><\/tr><tr><td>未经授权上电<\/td><td>操作人未在授权名单内，或未在规定时间段内上电<\/td><td>后台告警 + 标签红灯闪烁 + 推送班组长<\/td><\/tr><tr><td>未确认先上电<\/td><td>未经 NFC 确认直接上电（电流传感器检测到上电但无 NFC 记录）<\/td><td>后台告警 + 标签红灯闪烁<\/td><\/tr><tr><td>未按规定断电<\/td><td>超过规定时间未断电，或未确认断电<\/td><td>后台告警 + 推送责任人<\/td><\/tr><tr><td>调试超时<\/td><td>设备调试运行时长超过规程允许上限<\/td><td>后台告警 + 标签黄灯慢闪<\/td><\/tr><tr><td>异常运行<\/td><td>设备运行参数异常但未停机检查<\/td><td>后台告警 + 推送调试主管<\/td><\/tr><\/tbody><\/table><\/div><h3>6.5 与一期的关系<\/h3><ul><li>数据贯通：调试记录、问题整改数据自动同步至设备电子档案。<\/li><li>标签复用：调试阶段复用同一套墨水屏标签显示调试状态（调试中/待验收/已验收）。<\/li><li>权限扩展：在现有账号权限基础上增加调试管理角色。<\/li><li>看板集成：调试看板作为看板中心新增页面，与点检看板并列。<\/li><\/ul><h3>6.6 二期的硬件前提（必须先解决）<\/h3><p>二期四项核心能力中有三项<strong>不在电子标签的能力范围内<\/strong>：<\/p><div class=\"doc-table\"><table><tbody><tr><td>能力<\/td><td>真实依赖<\/td><td>现状<\/td><\/tr><tr><td>设备运行时长<\/td><td>外接电流传感器 或 接入设备 PLC/控制系统<\/td><td>❌ 全新硬件与集成工作，未立项、未选型<\/td><\/tr><tr><td>上电/断电动作检测<\/td><td>同上；NFC 只能证明&quot;人来确认过&quot;，不能证明&quot;设备真的上电了&quot;<\/td><td>❌ 同上<\/td><\/tr><tr><td>&quot;未确认先上电&quot;违章判定<\/td><td><strong>同时<\/strong>需要电流传感器 + NFC 双证据<\/td><td>❌ 两条依赖都未落实<\/td><\/tr><tr><td>调试状态流转<\/td><td>纯软件，可由标签系统承载<\/td><td>✅ 可做<\/td><\/tr><\/tbody><\/table><\/div><p><strong>结论：二期不是&quot;软件扩展&quot;，而是&quot;软件扩展 + 一套全新的设备侧电气采集方案&quot;。<\/strong> 若不解决电流/PLC 采集，违章告警只能退化为&quot;NFC 打卡记录审计&quot;，即只能发现&quot;没打卡&quot;，无法发现&quot;没打卡却上了电&quot;。这个降级口径必须提前与业务方对齐。<\/p><hr><h2>7. 核心业务链路<\/h2><p><strong>一期主链路<\/strong><\/p><pre>建立四级空间目录（部位层可跳过）\n  → 录入/导入设备台账（含保养周期与检查项）\n  → 登记并扫码绑定标签 → 首次下发刷屏\n  → 点检引擎按周期推算截止时间\n  → 临期 24h：黄色模板 + 黄灯慢闪\n  → 逾期：红底白字模板 + 红灯高频闪\n  → 巡检员 NFC 碰一碰 → 离线填报 → 拍照存证\n  → 提交 → 变屏 + 绿灯 3 秒 → 截止日后移\n  → 点检流水入库 → 看板中心三层聚合 → MES/EAM\n<\/pre><p><strong>环境联动支链<\/strong><\/p><pre>温湿度采集 → 超限判定 → 环境告警\n                    → 保养周期自动调整 → 点检引擎重算截止时间 → 触发模板下发\n<\/pre><p><strong>二期调试链路<\/strong><\/p><pre>外部导入/管理员指派调试任务 → 分配班组\n  → 调试员 NFC 确认上电 → 电流/PLC 验证实际上电\n  → 运行时长累计 → 规则引擎比对规程\n  → 违章判定 → 告警推送 + 标签红闪\n  → 调试完成 → 待验收 → 已验收 → 自动转入 PMS 保养点检\n<\/pre><hr><h2>8. 与造船行业流程的适配<\/h2><div class=\"doc-table\"><table><tbody><tr><td>造船流程节点<\/td><td>系统对应功能<\/td><\/tr><tr><td>设备进舱安装、悬挂保护告示牌<\/td><td>标签绑定设备资产，替代传统纸质告示牌<\/td><\/tr><tr><td>分段施工期间的设备保护巡查<\/td><td>按分段维度组织目录，支持分组批量管理<\/td><\/tr><tr><td>PMS 计划保养体系（7 天/30 天等周期）<\/td><td>点检引擎按保养周期自动推算截止时间<\/td><\/tr><tr><td>施工临时断网<\/td><td>网关本地缓存，移动端全离线作业<\/td><\/tr><tr><td>舱室环境监测<\/td><td>温湿度采集、超限告警、与保养策略联动<\/td><\/tr><tr><td>设备调试交付<\/td><td>二期调试管理：状态监控、动作监控、违章告警<\/td><\/tr><tr><td>交船验收、设备交接<\/td><td>看板展示设备完好率、点检完成率<\/td><\/tr><tr><td>MES/EAM 数据对接<\/td><td>RESTful API / MQTT 推送点检数据与工单<\/td><\/tr><tr><td>船级社规范要求的保养记录<\/td><td>自动生成点检流水，支持审计追溯<\/td><\/tr><\/tbody><\/table><\/div><hr><h2>9. 相对 v0.1 的结构变化与原型改造影响<\/h2><h3>9.1 模块级变化<\/h3><div class=\"doc-table\"><table><tbody><tr><td>v0.1<\/td><td>v0.4<\/td><td>变化性质<\/td><\/tr><tr><td>仓储管理<\/td><td>舱室/部位管理<\/td><td>更名 + 层级口径绑定造船分段编码<\/td><\/tr><tr><td>标签管理<\/td><td>标签管理<\/td><td>保留，新增点检状态模板组、扫码绑定、LED 控制策略<\/td><\/tr><tr><td>标签状态（一级模块）<\/td><td>拆入看板中心第二页 + 标签台账详情页<\/td><td><strong>降级/拆分<\/strong><\/td><\/tr><tr><td>全船看板<\/td><td>看板中心 · 第一页业务看板<\/td><td><strong>重构为三层角色 × 三级钻取<\/strong><\/td><\/tr><tr><td>——<\/td><td>看板中心 · 第二页系统监控看板<\/td><td><strong>新增<\/strong><\/td><\/tr><tr><td>——<\/td><td>点检引擎<\/td><td><strong>新增<\/strong>（v0.1 明确排除）<\/td><\/tr><tr><td>——<\/td><td>环境监测<\/td><td><strong>新增<\/strong><\/td><\/tr><tr><td>——<\/td><td>移动端<\/td><td><strong>新增<\/strong>（v0.1 列为扩展）<\/td><\/tr><tr><td>系统管理<\/td><td>系统管理<\/td><td>保留，新增角色视图配置<\/td><\/tr><tr><td>——<\/td><td>【二期】设备调试管理<\/td><td><strong>新增<\/strong><\/td><\/tr><\/tbody><\/table><\/div><h3>9.2 对现有交付物的影响<\/h3><p>现有 <code>prototype.html<\/code>（13 个视图）与 <code>product-structure.html<\/code> 都是按 v0.1 的 5 模块结构搭的。按 v0.4 改，影响如下：<\/p><div class=\"doc-table\"><table><tbody><tr><td>交付物<\/td><td>影响<\/td><td>工作量判断<\/td><\/tr><tr><td>产品结构说明页<\/td><td>结构树、模块卡片、流程图全部要换<\/td><td>中等，可在现有页面上改写<\/td><\/tr><tr><td>原型 · 舱室/部位管理<\/td><td>目录从三级改为四级（Hull No.→分段→舱室→部位），并要支持跳级挂载；示例数据、层级校验、移动/删除保护逻辑均需重做<\/td><td>中等，改 <code>prototype/app.js<\/code> 的目录模型与示例数据<\/td><\/tr><tr><td>原型 · 标签管理<\/td><td>新增点检状态模板组、扫码绑定流程<\/td><td>中等<\/td><\/tr><tr><td>原型 · 标签状态<\/td><td>原 4 个视图要重新归位到系统监控看板<\/td><td>中等，页面可复用、导航要重排<\/td><\/tr><tr><td>原型 · 全船看板<\/td><td><strong>推倒重做<\/strong>：从单页统计改为三层角色三视图 + 钻取<\/td><td><strong>大<\/strong><\/td><\/tr><tr><td>原型 · 系统监控看板<\/td><td>全新页面<\/td><td>中等<\/td><\/tr><tr><td>原型 · 点检引擎<\/td><td>全新：周期配置、预警规则、点检流水<\/td><td><strong>大<\/strong><\/td><\/tr><tr><td>原型 · 环境监测<\/td><td>全新页面<\/td><td>中等<\/td><\/tr><tr><td>原型 · 移动端<\/td><td>全新形态，与现有桌面后台原型不同框架<\/td><td><strong>大<\/strong>，建议单独立项<\/td><\/tr><tr><td><strong>需求映射索引<\/strong><\/td><td><code>coverage<\/code> / <code>requirementDemos<\/code> 用的是零起始的模块/条目索引，模块数量与表格行一变<strong>全部失效<\/strong><\/td><td>必须整体重建，不能局部改<\/td><\/tr><\/tbody><\/table><\/div><p><strong>关键提醒<\/strong>：<code>prototype/build.py<\/code> 按产品文档第 4 章各小节的表格顺序提取需求。本版章节编号与表格结构与 v0.1 完全不同，直接跑构建会产出错位的需求对照。必须先改构建器的章节定位逻辑，再重建映射。<\/p><h3>9.3 建议的推进方式<\/h3><p>不建议一次性把原型改到 v0.4。建议分两步：<\/p><ol><li><strong>先定结构，后改原型<\/strong>：本文 + 更新后的产品结构说明页先拿去对齐，确认第 11 章的口径问题。<\/li><li><strong>原型分批改<\/strong>：口径确认后，优先做&quot;看板中心（三层角色）+ 点检引擎&quot;这两块新增价值最大、也最需要可视化讨论的部分；标签管理、舱室管理在现有原型上增量改。<\/li><\/ol><hr><h2>10. 硬件与平台能力核对<\/h2><p>本章是本版与来源文档的主要分歧点。<strong>来源文档把多项未经证明的能力写成了既成事实<\/strong>，直接按其实施会产生选型风险。<\/p><h3>10.1 与候选机 STag29AQ 的直接冲突<\/h3><div class=\"doc-table\"><table><tbody><tr><td>项<\/td><td>V0.4 主张<\/td><td>现有依据<\/td><td>影响<\/td><\/tr><tr><td>屏幕色彩<\/td><td>三色（黑/白/红）<\/td><td>候选机四色（黑/白/红/黄）<\/td><td>原文自身矛盾：要求黄色临期模板却写三色。<strong>按四色设计<\/strong>，四色更有利<\/td><\/tr><tr><td>通信制式<\/td><td>Sub-1G / BLE<\/td><td>仅 BLE 5.0<\/td><td>要 Sub-1G 必须换型号。船厂金属舱室下 BLE 穿透性是实测项<\/td><\/tr><tr><td>NFC<\/td><td>内置 Type 2、&lt;2cm、NDEF Token 防伪<\/td><td>规格书标为<strong>可选项<\/strong>，无芯片型号<\/td><td><strong>一期移动端防假检、二期上电确认全部建立在这条上<\/strong>。不落实则两个核心场景塌方<\/td><\/tr><tr><td>按键数量<\/td><td>1~2 颗<\/td><td>实物 1 颗，且按键后广播 30 秒内不响应其他指令<\/td><td>按键语义设计要按 1 颗 + 30 秒锁定窗口<\/td><\/tr><tr><td>温湿度集成<\/td><td>可选集成在标签内<\/td><td>规格书未提及<\/td><td>集成式方案需换型或定制；建议一期走外挂式或网关集成<\/td><\/tr><\/tbody><\/table><\/div><h3>10.2 环境适应性冲突（选型级风险）<\/h3><p>候选机工作环境：<strong>0–40°C、45%–70% RH、无 IP 防护等级、电子纸屏幕易碎<\/strong>。<\/p><div class=\"doc-table\"><table><tbody><tr><td>场景<\/td><td>冲突<\/td><\/tr><tr><td>环境监测模块<\/td><td>要监测&quot;高湿超限&quot;的舱室，但标签自身湿度上限只有 70% RH——<strong>超限时监测终端可能已在工作范围外<\/strong><\/td><\/tr><tr><td>船厂/舱室工况<\/td><td>盐雾、油污、粉尘、振动、跌落、金属遮挡均无证明；无 IP 等级<\/td><\/tr><tr><td>防爆区域<\/td><td>标签无防爆认证。技术要求只明确手机需防爆，标签/网关是否需要必须由现场分区确认<\/td><\/tr><\/tbody><\/table><\/div><p>这是本版最需要业务方决策的一条：<strong>要么接受标签只部署在环境可控的舱室，要么换工业级型号重新选型。<\/strong><\/p><h3>10.3 续航模型必须重算<\/h3><p>&quot;5 年续航&quot;是 25°C、每天刷图 5 次的理论值。V0.4 新增的负载全部未计入：<\/p><ul><li>临期黄灯慢闪、逾期红灯高频间歇闪烁（长时间持续）<\/li><li>&quot;已超期 XX 小时&quot;动态文案 → 需周期性重刷屏<\/li><li>规格书本身要求&quot;超过一周无内容更新会自动重刷&quot;&quot;建议每 24 小时刷新一次&quot;<\/li><li>心跳上报、按键触发、（若集成）温湿度采集<\/li><\/ul><p><strong>必须先定统一负载模型<\/strong>（刷屏次数/天、LED 占空比、心跳频率、温度、重试次数），再谈续航。当前不能对外承诺 5 年。<\/p><h3>10.4 平台侧未证明项<\/h3><div class=\"doc-table\"><table><tbody><tr><td>项<\/td><td>状态<\/td><\/tr><tr><td>Docker 私有化部署<\/td><td>厂商仅宣传&quot;支持内网私有部署&quot;，未承诺 Docker、离线依赖、授权、升级回滚、备份恢复<\/td><\/tr><tr><td>网关缓存 30 天<\/td><td>厂商只写&quot;USB 断网存储&quot;，无容量、数据模型、30 天保证、补传策略<\/td><\/tr><tr><td>RESTful API / MQTT<\/td><td>有 API/SDK 宣传，未确认 REST 规格、MQTT 主题、认证、幂等、版本兼容、限流<\/td><\/tr><tr><td>刷新回执<\/td><td>只承诺&quot;秒级刷新&quot;，无完整刷新/局刷/各温区时长口径，无可靠回执机制<\/td><\/tr><tr><td>多基站去重与分段定位<\/td><td>无产品承诺，去重算法与准确率未知<\/td><\/tr><\/tbody><\/table><\/div><h3>10.5 二期的电气采集能力缺口<\/h3><p>见 6.6。运行时长、上电/断电检测需要<strong>外接电流传感器或接入设备 PLC<\/strong>，属全新硬件与集成工作，当前未立项、未选型、未估算成本。<\/p><hr><h2>11. 边界与待确认事项<\/h2><h3>11.1 必须先决策的口径冲突<\/h3><ol><li><del><strong>目录层级<\/strong><\/del> → <strong>已决策（2026-09-15）<\/strong>：采用四级 <code>Hull No. → 分段 → 舱室 → 部位<\/code>，设备资产不占层级，部位层允许跳级。详见 4.1。遗留：是否需要&quot;总段/Grand Block&quot;层。<\/li><li><strong>产品名称<\/strong>：是否正式改为&quot;船舶资产智能点检标签管理系统&quot;。<\/li><li><strong>执行层视图归属<\/strong>：看板&quot;视图三 · 专业工人&quot;与移动端功能重叠，是 Web 只读镜像还是独立形态。<\/li><li><strong>标签状态明细页归属<\/strong>：单标签详情挂在标签台账还是系统监控看板之下。<\/li><li><strong>告警中心范围<\/strong>：是否统一承载业务告警 + 系统告警，还是只做 IT 运维告警。<\/li><li><strong>保养周期自动调整<\/strong>：环境联动改周期是否需人工确认，调整历史如何追溯。<\/li><\/ol><h3>11.2 必须先验证的硬件前提<\/h3><ol><li>标签 NFC 是否落实（决定移动端防假检与二期上电确认能否成立）。<\/li><li>现场环境与危险分区，标签/网关是否需要防爆与 IP 防护。<\/li><li>统一负载模型下的实测续航。<\/li><li>金属舱室下 BLE 覆盖实测，据此设计网关点位（<strong>不能用空旷 30–70m 的标称值<\/strong>）。<\/li><li>温湿度采集走哪条方案（集成/外挂/网关）。<\/li><li>厂商刷新回执接口能力，决定&quot;已更新&quot;能否真正确认。<\/li><\/ol><h3>11.3 二期前必须解决<\/h3><ol><li>电流传感器或 PLC 接入方案的选型、成本与施工方式。<\/li><li>若电气采集不落实，违章告警降级为&quot;NFC 打卡审计&quot;的口径是否可接受。<\/li><li>调试任务的外部来源系统与接口。<\/li><li>调试规程与违章规则的正式清单（本版规则仅为示例）。<\/li><\/ol><h3>11.4 本版明确不含<\/h3><p>页面布局与视觉稿、字段字典、接口定义、数据模型、性能与验收指标、多船管理、3D 数字孪生、预测性维护、船级社 PMS 认证对接、AR 辅助巡检。<\/p><hr><h2>12. 文档状态<\/h2><div class=\"doc-table\"><table><tbody><tr><td>项<\/td><td>状态<\/td><\/tr><tr><td>本文性质<\/td><td>讨论稿，非批准规格<\/td><\/tr><tr><td>来源<\/td><td>DeepSeek 分享对话 V0.4（外部 AI 生成），已存档于 <code>docs/<\/code><\/td><\/tr><tr><td>与 v0.1 的关系<\/td><td>范围扩张，非增量修订；v0.1 保留作为历史版本<\/td><\/tr><tr><td>硬件结论<\/td><td>未升级。第 10 章所有 ❌/⚠️ 项在取得书面规格、合同附件或测试报告前不得升级为&quot;已确认&quot;<\/td><\/tr><tr><td>原型同步<\/td><td>未同步。现有原型仍是 v0.1 结构，改造范围见第 9 章<\/td><\/tr><\/tbody><\/table><\/div>", "version": "v0.4"};

function importForm(){importRows=[];modal('批量导入资产信息',`<div class="hint">此原型支持 CSV 文件或粘贴 CSV 文本。按设备编码匹配：不存在则新增，已存在则更新。Excel 文件导入后续细化。</div><div class="actions" style="margin-bottom:15px"><label class="btn">选择 CSV 文件<input type="file" accept=".csv,text/csv" id="csv-file" style="display:none"></label>${action('download-import','下载 CSV 模板')}</div><label class="form-field">CSV 内容<textarea id="csv-input" rows="7">${esc(csvExample)}</textarea></label><div class="actions" style="margin-top:15px">${action('import-check','校验并预览','','btn primary')}</div><div id="import-results" aria-live="polite"></div>`,true);}
function parseCSV(s){const rows=[];let row=[],v='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(v);v='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v='';}else v+=c;}if(quoted)throw Error('CSV 引号未闭合');row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows;}
function checkImport(){try{const rows=parseCSV($('#csv-input').value.replace(/^\uFEFF/,''));const heads=rows.shift()||[],required=['设备编码','设备名称','所属目录'];if(!required.every(h=>heads.includes(h)))throw Error('缺少必需表头：设备编码、设备名称、所属目录');const keys={设备编码:'code',设备名称:'name',设备型号:'model',所属目录:'dir',责任班组:'team',责任人:'owner'};const seen=new Set();importRows=rows.map((r,i)=>{const obj={};heads.forEach((h,j)=>{if(keys[h])obj[keys[h]]=(r[j]||'').trim();});const matches=db.dirs.filter(d=>d.name===obj.dir||path(d.id)===obj.dir);let error=!obj.code||!obj.name?'编码和名称不能为空':seen.has(obj.code)?'导入文件内设备编码重复':matches.length!==1?'所属目录不存在或名称不唯一（可填舱室或部位）':'';seen.add(obj.code);return {...obj,dir:matches[0]?.id,row:i+2,error,existing:db.assets.find(a=>a.code===obj.code)?.id};});if(!importRows.length)throw Error('没有可导入的数据');$('#import-results').innerHTML=`<div class="import-summary">共 ${importRows.length} 条，${importRows.filter(r=>!r.error).length} 条通过，${importRows.filter(r=>r.error).length} 条需要修正。</div><div class="import-preview">${table(['行号','设备编码','设备名称','结果'],importRows.map(r=>`<tr><td>${r.row}</td><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${r.error?badge(r.error,'bad'):badge(r.existing?'更新':'新增')}</td></tr>`).join(''))}</div><div class="form-actions"><button class="btn primary" data-action="import-commit" ${importRows.some(r=>r.error)?'disabled':''}>确认导入 ${importRows.length} 条</button></div>`;}catch(e){importRows=[];$('#import-results').innerHTML=`<p class="form-error">${esc(e.message)}</p>`;}}
function download(name,rows){const safe=v=>{let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('已生成 CSV 下载文件');}

document.addEventListener('change',async e=>{const t=e.target;if(t.matches('[data-filter]')){filter=t.value;selected.clear();render();}if(t.matches('[data-group-filter]')){groupFilter=t.value;selected.clear();render();}if(t.matches('[data-select]')){t.checked?selected.add(t.dataset.select):selected.delete(t.dataset.select);render();}if(t.matches('[data-select-all]')){filteredLabels().forEach(l=>t.checked?selected.add(l.id):selected.delete(l.id));render();}if(t.id==='csv-file'&&t.files[0]){if(t.files[0].size>1024*1024){toast('演示文件请控制在 1 MB 内');return;}$('#csv-input').value=await t.files[0].text();checkImport();}});
document.addEventListener('input',e=>{if(e.isComposing)return;const t=e.target;if(t.matches('[data-search]')){query=t.value;const pos=t.selectionStart;selected.clear();render();const input=$('[data-search]');input.focus();input.setSelectionRange(pos,pos);}if(t.closest('[data-form="template"]')&&t.matches('[data-preview]')){const f=t.closest('form'),d=new FormData(f);$('#live-preview').innerHTML=preview({heading:d.get('heading'),color:d.get('color'),showModel:d.has('showModel'),showOwner:d.has('showOwner')},asset(d.get('previewAsset')));}if(t.id==='csv-input'){importRows=[];$('#import-results').innerHTML='';}});
document.addEventListener('keydown',e=>{const t=e.target.closest('.stat[role=button]');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();t.click();}});
window.addEventListener('hashchange',readRoute);
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
readRoute();persist();
</script>
